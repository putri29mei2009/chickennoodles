<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Chickennoodles Syafira</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>🍜 Chickennoodles Syafira</h1>
        <nav>
            <a href="index.html">Beranda</a>
            <a href="user_cart.html">🛒 Keranjang</a>
            <a href="checkout.html">Checkout</a>
        </nav>
    </header>

    <main class="container">
        <h2>Informasi Pengiriman dan Pembayaran</h2>

        <div style="display: flex; gap: 30px; flex-wrap: wrap; margin-top: 20px;">
            <!-- Form Data Pembeli -->
            <form action="order_confirmation.html" style="flex: 1; min-width: 300px;">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px;">Nama Lengkap:</label>
                    <input type="text" placeholder="Masukkan nama Anda" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px;">Nomor Telepon / WA:</label>
                    <input type="tel" placeholder="08xxxxxxxxxx" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px;">Alamat Lengkap Pengiriman:</label>
                    <textarea rows="4" placeholder="Masukkan alamat lengkap pengiriman" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;"></textarea>
                </div>

                <button type="submit" class="btn" style="width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Buat Pesanan</button>
            </form>

            <!-- Ringkasan Pesanan -->
            <div style="flex: 1; min-width: 280px; background-color: #fff; padding: 20px; border-radius: 8px; border: 1px solid #eee; height: fit-content;">
                <h3>Ringkasan Pesanan Anda</h3>
                <hr style="margin: 10px 0;">
                
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span>Mie Ayam Biasa (x1)</span>
                    <span>Rp 12.000</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span>Mie Ayam Bakso (x1)</span>
                    <span>Rp 15.000</span>
                </div>
                
                <hr style="margin: 10px 0;">
                <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1em;">
                    <span>Total Pembayaran</span>
                    <span style="color: #e67e22;">Rp 27.000</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
