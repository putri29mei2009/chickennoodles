<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja Anda - Chickennoodles Syafira</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>🍜 Chickennoodles Syafira</h1>
        <nav>
            <a href="index.html">Beranda</a>
            <a href="user_cart.html">🛒 Keranjang</a>
            <a href="checkout.html">Checkout</a>
        </nav>
    </header>

    <main class="container">
        <h2>Keranjang Belanja Anda</h2>

        <table class="cart-table" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
            <thead>
                <tr style="background-color: #e67e22; color: white;">
                    <th style="padding: 10px; text-align: left;">PRODUK</th>
                    <th style="padding: 10px;">HARGA</th>
                    <th style="padding: 10px;">KUANTITAS</th>
                    <th style="padding: 10px;">SUBTOTAL</th>
                    <th style="padding: 10px;">AKSI</th>
                </tr>
            </thead>
            <tbody>
                <tr style="border-bottom: 1px solid #ddd; text-align: center;">
                    <td style="padding: 10px; text-align: left; display: flex; align-items: center; gap: 10px;">
                        <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500" alt="Mie Ayam Biasa" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;">
                        <span>Mie Ayam Biasa</span>
                    </td>
                    <td>Rp 12.000</td>
                    <td><input type="number" value="1" min="1" style="width: 50px; text-align: center;"></td>
                    <td>Rp 12.000</td>
                    <td><button type="button" style="background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">Hapus</button></td>
                </tr>
                <tr style="border-bottom: 1px solid #ddd; text-align: center;">
                    <td style="padding: 10px; text-align: left; display: flex; align-items: center; gap: 10px;">
                        <img src="https://images.unsplash.com/photo-1612927601601-6638404737ce?w=500" alt="Mie Ayam Bakso" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;">
                        <span>Mie Ayam Bakso</span>
                    </td>
                    <td>Rp 15.000</td>
                    <td><input type="number" value="1" min="1" style="width: 50px; text-align: center;"></td>
                    <td>Rp 15.000</td>
                    <td><button type="button" style="background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">Hapus</button></td>
                </tr>
            </tbody>
        </table>

        <div style="margin-top: 20px; text-align: right;">
            <h3>Total: Rp 27.000</h3>
            <a href="checkout.html" class="btn" style="display: inline-block; padding: 10px 20px; background-color: #27ae60; color: white; text-decoration: none; border-radius: 5px;">Lanjutkan ke Checkout</a>
        </div>
    </main>
</body>
</html>
